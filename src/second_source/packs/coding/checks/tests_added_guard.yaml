# Guard: are the "added tests" themselves switched off? (role: guard, required)
# A PR that adds test files whose new tests are skipped has not added running tests.
id: coding.tests_added_guard
version: 1.2.0
kind: state
role: guard
level: L4
applies_to: [TESTS_ADDED]
evidence:
  summary:
    record_type: changed_files_summary
derive:
  known: "size(summary) > 0 && !('changed_files_summary' in stale)"
  # Every field read is guarded by has(): an older or newer summary must not error.
  s: "known ? summary[0] : {}"
  skips: "has(s.test_skips_net) ? s.test_skips_net : 0"
  added: "has(s.test_cases_added) ? s.test_cases_added : 0"
  # New cases in files where one marker skips a whole group (describe.skip, a skipped test
  # class, a module-level pytestmark).
  suite_skipped: "has(s.suite_skipped_cases) ? s.suite_skipped_cases : 0"
outcomes:
  - when: "added > 0 && ((skips > 0 && added <= skips) || suite_skipped >= added)"
    result: UNVERIFIABLE
    reason: ADDED_TESTS_ARE_SKIPPED
  - {otherwise: true, result: VERIFIED, reason: ADDED_TESTS_NOT_SKIPPED}
explain: "{added} test case(s) added, {skips} newly skipped"
