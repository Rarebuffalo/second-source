# Second Source GitHub Action (docs/action.md).
#
# A composite action: it installs uv and the locked dependencies, then runs `second-source
# action` from this repository's own source. It never checks out or runs the pull request's
# code, which is why the recommended workflow can safely use `pull_request_target` (fork PRs
# then get a token that can write check runs). Do not add an actions/checkout step to the
# workflow that uses it.
# The Marketplace name must be unique across all actions, users and organisations, and a
# GitHub account named second-source exists. The check run on PRs is still "Second Source".
name: Second Source Claim Check
description: Check whether an AI coding agent's claims in a pull request are true, against CI, Git and issue evidence.
author: Rarebuffalo
branding:
  icon: check-circle
  color: green

inputs:
  github-token:
    description: Token for reading the pull request and writing the check run.
    default: ${{ github.token }}
  wait-minutes:
    description: How long to wait for CI before publishing (0 to 60). Use 0 on private repositories to save Actions minutes.
    default: "10"
  only-agents:
    description: Skip pull requests with no detected coding agent.
    default: "true"
  fail-on-contradiction:
    description: Make the check fail when a claim is contradicted (by default it is advice and never blocks a merge).
    default: "false"
  ignore-claims:
    description: Claim types to switch off, comma-separated (TESTS_PASS, BUILD_OK, LINT_OK, TESTS_ADDED, DOCS_UPDATED, FIXES_ISSUE, DEPLOYED). They are neither checked nor shown.
    default: ""
  sweep-days:
    description: How far back (in days) the scheduled sweep re-checks agent pull requests.
    default: "30"

runs:
  using: composite
  steps:
    # Pinned to a commit (v10.3.3) and an exact uv version whose checksum that release bundles:
    # this step runs in a workflow that holds a write token, so a moved tag upstream must not
    # change what runs. Update both deliberately, to releases at least two weeks old.
    # No dependency cache: on pull_request_target and workflow_run a cache can be poisoned by
    # other runs, so setup-uv's own default (off for these events) is kept. Installing costs a
    # few seconds.
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        version: "0.13.6"
        enable-cache: false
        ignore-empty-workdir: true  # the workflow never checks out the PR, by design

    # Only the locked, hash-checked runtime dependencies are installed, and the project itself is
    # not built: building would fetch its build backend (hatchling and its dependencies) from
    # PyPI unpinned on every run. This step runs before the token is in the environment.
    - name: Install locked dependencies
      shell: bash
      # --no-build: wheels only, so no package is ever built (and no build backend fetched).
      run: uv sync --frozen --no-dev --no-install-project --no-build --project "$GITHUB_ACTION_PATH"

    # Run from the Action's own source; the PR's code is never checked out or imported.
    - name: Check agent claims
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        # Without this, `python -m` puts the working directory first on sys.path, so a file
        # such as yaml.py left in the workspace (a self-hosted runner, an earlier checkout)
        # would run with the token (security review 2, N3).
        PYTHONSAFEPATH: "1"
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_WAIT_MINUTES: ${{ inputs.wait-minutes }}
        INPUT_ONLY_AGENTS: ${{ inputs.only-agents }}
        INPUT_FAIL_ON_CONTRADICTION: ${{ inputs.fail-on-contradiction }}
        INPUT_SWEEP_DAYS: ${{ inputs.sweep-days }}
        INPUT_IGNORE_CLAIMS: ${{ inputs.ignore-claims }}
      run: >-
        uv run --no-sync --frozen --project "$GITHUB_ACTION_PATH"
        python -m second_source.cli.main action
