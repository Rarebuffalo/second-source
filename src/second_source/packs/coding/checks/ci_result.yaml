# L4: "All tests pass" / "Build succeeds" / "Lint passes" — do the CI jobs on the referenced
# commit agree?
#
# One definition serves all three claim types; job_matches(claim.type, name) picks the jobs
# that count (test jobs for TESTS_PASS, build jobs for BUILD_OK, lint jobs for LINT_OK).
#
# Re-runs: the source keys each result by commit and job name and uses the run id as the
# version, so de-duplication keeps only the newest run of every job. A flaky job that failed
# and then passed on re-run counts as passed.
# Cancelled, skipped and neutral results are neither passes nor failures.
#
# Local claims ("tests pass locally", scope=local): passing CI corroborates them, but failing
# CI does not prove them false, because local and CI environments differ. They get the
# distinct UNVERIFIABLE reason CI_FAILED_LOCAL_CLAIM, which the benchmark reports separately.
#
# Subset claims ("targeted tests pass", "unit tests for X pass", ✅ `pytest tests/test_x.py`,
# ✅ `biome lint`, scope=subset) work the same way: matching CI jobs that pass corroborate
# them, but a failing job may be one the claim never covered (an E2E suite, another package),
# so failure gives UNVERIFIABLE with reason CI_FAILED_SUBSET_CLAIM.
#
# No CI data at all on the commit (NO_CI_RECORDS) is reported apart from CI that ran without a
# matching job (NO_MATCHING_CI_JOBS): GitHub deletes old workflow runs, so for older PRs the
# evidence is simply gone, which says nothing about job naming.
#
# Editable texts (PR body and title) are read in their final form, but the PR may have gained
# commits after it was opened: Copilot opens with an empty "Initial plan" commit and rewrites
# the body as it works, while other agents write the body once and humans add commits later.
# Such claims carry the commit at PR creation (`ref`) and the final head (`final_ref`):
# - VERIFIED needs the matching jobs to pass on the final head;
# - CONTRADICTED needs matching jobs to fail on both commits, so the claim was false at every
#   point we can see;
# - a failure on only one of them is UNVERIFIABLE (CLAIM_COMMIT_AMBIGUOUS).
# Claims with a single commit (commit messages, comments, PRs without later commits) behave as
# before: `final_ref` is absent and both views are the same commit.
id: coding.ci_result
version: 1.4.0
kind: state
level: L4
applies_to: [TESTS_PASS, BUILD_OK, LINT_OK]
params:
  # How long to wait for CI before giving up on a running or missing job.
  timeout_hours: {type: int, default: 6, min: 1, max: 48}
evidence:
  checks:
    record_type: check_result
    where: >-
      has(claim.attributes.ref) && (e.ref == claim.attributes.ref ||
      (has(claim.attributes.final_ref) && e.ref == claim.attributes.final_ref))
derive:
  start: "has(claim.attributes.ref) ? claim.attributes.ref : ''"
  final: "has(claim.attributes.final_ref) ? claim.attributes.final_ref : start"
  relevant: "checks.filter(c, job_matches(claim.type, c.name))"
  at_ref: "relevant.filter(c, c.ref == start)"
  at_final: "relevant.filter(c, c.ref == final)"
  failed_ref: "at_ref.filter(c, c.status == 'completed' && has(c.conclusion) && c.conclusion in ['failure', 'timed_out'])"
  failed_final: "at_final.filter(c, c.status == 'completed' && has(c.conclusion) && c.conclusion in ['failure', 'timed_out'])"
  failed_somewhere: "size(failed_ref) > 0 || size(failed_final) > 0"
  failed_everywhere: "size(failed_ref) > 0 && size(failed_final) > 0"
  running: "at_final.filter(c, c.status != 'completed')"
  passed: "at_final.filter(c, c.status == 'completed' && has(c.conclusion) && c.conclusion == 'success')"
  total: "size(at_final)"
  passed_count: "size(passed)"
  local: "has(claim.attributes.scope) && claim.attributes.scope == 'local'"
  subset: "has(claim.attributes.scope) && claim.attributes.scope == 'subset'"
  deadline: "claim.made_at + duration(string(params.timeout_hours) + 'h')"
outcomes:
  - {when: "'check_result' in stale", result: UNVERIFIABLE, reason: SOURCE_STALE}
  - {when: "!has(claim.attributes.ref)", result: UNVERIFIABLE, reason: NO_COMMIT_REFERENCE}
  - {when: "failed_somewhere && local", result: UNVERIFIABLE, reason: CI_FAILED_LOCAL_CLAIM}
  - {when: "failed_somewhere && subset", result: UNVERIFIABLE, reason: CI_FAILED_SUBSET_CLAIM}
  - {when: "failed_everywhere", result: CONTRADICTED, reason: CI_JOB_FAILED}
  - {when: "failed_somewhere", result: UNVERIFIABLE, reason: CLAIM_COMMIT_AMBIGUOUS}
  # CI may not have started yet, or may still be running.
  - {when: "(total == 0 || size(running) > 0) && now < deadline", result: PENDING, reason: AWAITING_CI}
  - {when: "size(checks) == 0", result: UNVERIFIABLE, reason: NO_CI_RECORDS}
  - {when: "size(relevant) == 0", result: UNVERIFIABLE, reason: NO_MATCHING_CI_JOBS}
  - {when: "size(running) > 0", result: UNVERIFIABLE, reason: CI_TIMEOUT}
  - {when: "passed_count == 0", result: UNVERIFIABLE, reason: NO_CI_RESULTS}
  - {otherwise: true, result: VERIFIED, reason: ALL_MATCHING_CI_JOBS_PASSED}
explain: "{passed_count} of {total} matching CI jobs passed"
