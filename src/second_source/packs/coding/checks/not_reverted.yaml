# L5: a merged change stays merged — no revert of the merge commit within a window.
# Applies to the implicit MERGE_HOLDS claim that every merged agent PR makes.
#
# Only merges into the default branch are watched. A PR merged into a feature or release branch
# (often deleted later) has no meaningful branch to scan, so it is UNVERIFIABLE
# (NOT_DEFAULT_BRANCH) instead of a scan error or a misleading "not reverted".
#
# A revert that was itself reverted ("Revert "Revert ..."") put the change back: whether the
# change "held" is then ambiguous, so it is UNVERIFIABLE (REVERT_UNDONE), never CONTRADICTED.
id: coding.not_reverted
version: 2.0.0
kind: temporal
level: L5
applies_to: [MERGE_HOLDS]
params:
  # The GitHub source scans 30 days after the merge (sources/github/source.py, REVERT_WINDOW).
  # A longer window here also needs a longer scan there, or later reverts would be missed.
  window_days: {type: int, default: 30, min: 7, max: 90}
evidence:
  reverts:
    record_type: revert
    where: "e.reverted_sha == claim.attributes.merge_sha"
  prs:
    record_type: pr_state
derive:
  other_branch: >-
    prs.exists(p, has(p.base_ref) && has(p.default_branch) && p.base_ref != p.default_branch)
  standing: "reverts.filter(r, !(has(r.undone) && r.undone))"
  revert_count: "size(reverts)"
  window_end: "claim.made_at + duration(string(params.window_days * 24) + 'h')"
outcomes:
  - {when: "other_branch", result: UNVERIFIABLE, reason: NOT_DEFAULT_BRANCH}
  - {when: "'revert' in stale", result: UNVERIFIABLE, reason: SOURCE_STALE}
  - {when: "size(standing) > 0", result: CONTRADICTED, reason: REVERTED}
  - {when: "revert_count > 0", result: UNVERIFIABLE, reason: REVERT_UNDONE}
  - {when: "now < window_end", result: PENDING, reason: IN_WINDOW}
  - {otherwise: true, result: VERIFIED, reason: NOT_REVERTED}
explain: "{revert_count} revert(s) found within {window_days} days"
