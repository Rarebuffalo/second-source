[project]
name = "second-source"
version = "0.1.0"
description = "Independent verification of AI agents' claims against the systems they act on."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Second Source contributors" }]
keywords = ["ai-agents", "verification", "coding-agents", "pull-requests", "ci", "llm", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "cel-python>=0.2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Rarebuffalo/second-source"
Issues = "https://github.com/Rarebuffalo/second-source/issues"
Documentation = "https://github.com/Rarebuffalo/second-source/tree/main/docs"

[project.scripts]
second-source = "second_source.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_source"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets test files share a name in different folders (e.g. two test_checks.py).
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
