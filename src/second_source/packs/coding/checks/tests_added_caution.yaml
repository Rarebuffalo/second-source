# Optional guard: test files changed, but no new test case or assertion found in them.
# A caution, not a withdrawal, until measured: fixture trees under tests/ can look like tests.
id: coding.tests_added_caution
version: 1.1.0
kind: state
role: guard
required: false
level: L4
applies_to: [TESTS_ADDED]
evidence:
  summary:
    record_type: changed_files_summary
derive:
  # Field reads are guarded by has(): an older or newer summary must not error.
  s: "size(summary) > 0 ? summary[0] : {}"
  known: "size(summary) > 0 && (has(s.uninspected) ? s.uninspected : 0) == 0"
  empty: "known && (has(s.test_source_changed) ? s.test_source_changed : 0) > 0 && (has(s.test_cases_added) ? s.test_cases_added : 0) == 0 && (has(s.asserts_added) ? s.asserts_added : 0) == 0"
outcomes:
  - {when: "empty", result: UNVERIFIABLE, reason: NO_TEST_CASE_ADDED}
  - {otherwise: true, result: VERIFIED, reason: TEST_CASES_FOUND}
