# Coding pack: verifies what coding agents claim in pull requests.
# Design and evidence contract: docs/packs/coding.md
id: coding
version: 0.5.0
kind: agent_type
description: Claims made by coding agents in pull requests, checked against CI and Git evidence.
claim_types:
  - TESTS_PASS
  - BUILD_OK
  - LINT_OK
  - TESTS_ADDED
  - FIXES_ISSUE
  - DOCS_UPDATED
  - DEPLOYED
  - MERGE_HOLDS
checks:
  - checks/ci_result.yaml
  - checks/tests_added.yaml
  - checks/docs_updated.yaml
  - checks/fixes_issue.yaml
  - checks/fixes_issue_durable.yaml
  - checks/deployed.yaml
  - checks/not_reverted.yaml
  # Integrity guards: withdraw or caution a VERIFIED, never accuse (docs/packs/coding.md)
  - checks/integrity_guard.yaml
  - checks/tests_added_guard.yaml
  - checks/ci_config_caution.yaml
  - checks/tests_removed_caution.yaml
  - checks/tests_added_caution.yaml
  - checks/lint_caution.yaml
  - checks/integrity_inspection.yaml
  - checks/matching_jobs_caution.yaml
  - checks/ci_weakening_caution.yaml
functions: second_source.packs.coding.functions:register
