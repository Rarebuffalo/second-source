name: Idea or feature request
description: A new claim type, agent, check, domain or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you suggest?
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Real PR URLs or agent wording that show the need.
