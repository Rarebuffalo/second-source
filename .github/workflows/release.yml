# Release: a tag vX.Y.Z builds the package, publishes it to PyPI and creates the GitHub
# release. See CONTRIBUTING.md, "Releasing".
#
# PyPI uses trusted publishing (OpenID Connect): no token is stored anywhere. The "pypi"
# environment must be configured as a trusted publisher on pypi.org for this repository and
# this workflow file, and can require a manual approval before publishing.
# Every action is pinned to a commit, as the Action itself is.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      # The tag, the package version and the changelog must agree before anything is published.
      - name: Check the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run --frozen python -c "import second_source; print(second_source.__version__)")
          test "v$version" = "$TAG" || { echo "::error::tag $TAG but package version $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG has no [$version] section"; exit 1; }

      - name: Lint and test
        run: ./scripts/check.sh

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      # Notes are this version's CHANGELOG section. Publishing the Action to the Marketplace is
      # done by a maintainer on the release page (GitHub has no API for it).
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/* --title "Second Source $TAG" --notes-file notes.md --prerelease
