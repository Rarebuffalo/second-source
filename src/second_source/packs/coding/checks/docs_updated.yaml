# L4: "Updated the docs/README" — does the PR actually change documentation files?
#
# Never CONTRADICTED. Documentation can live in code (docstrings, XML doc comments, roxygen,
# Doxygen), and "documentation" in a sentence often means exactly that; finding no doc file is
# not proof (see tests_added.yaml for the audit behind this).
id: coding.docs_updated
version: 2.0.0
kind: state
level: L4
applies_to: [DOCS_UPDATED]
evidence:
  files:
    record_type: changed_file
derive:
  doc_files: "files.filter(f, f.status != 'removed' && is_doc_path(f.path))"
  doc_file_count: "size(doc_files)"
outcomes:
  - {when: "'changed_file' in stale", result: UNVERIFIABLE, reason: SOURCE_STALE}
  - {when: "size(files) == 0", result: UNVERIFIABLE, reason: NO_FILE_LIST}
  - {when: "doc_file_count > 0", result: VERIFIED, reason: DOC_FILES_CHANGED}
  - {otherwise: true, result: UNVERIFIABLE, reason: NO_DOC_FILES_FOUND}
explain: "{doc_file_count} documentation file(s) changed"
