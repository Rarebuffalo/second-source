# Coding pack: verifies what coding agents claim in pull requests.
# Design and evidence contract: docs/packs/coding.md
id: coding
version: 0.3.0
kind: agent_type
description: Claims made by coding agents in pull requests, checked against CI and Git evidence.
claim_types:
  - TESTS_PASS
  - BUILD_OK
  - LINT_OK
  - TESTS_ADDED
  - FIXES_ISSUE
  - DOCS_UPDATED
  - DEPLOYED
  - MERGE_HOLDS
checks:
  - checks/ci_result.yaml
  - checks/tests_added.yaml
  - checks/docs_updated.yaml
  - checks/fixes_issue.yaml
  - checks/fixes_issue_durable.yaml
  - checks/deployed.yaml
  - checks/not_reverted.yaml
functions: second_source.packs.coding.functions:register
